# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
---
ci:
  autoupdate_schedule: quarterly
  skip: ["identity", "pytest", "test-coverage", "coverage-badge"]

default_install_hook_types: ["pre-commit", "pre-push"]
default_stages: ["pre-commit"]

repos:
  - repo: meta
    hooks:
      - id: identity

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: "coverage.svg"
      - id: mixed-line-ending
        args: ["--fix", "lf"]
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.7.0
    hooks:
      - id: validate_manifest

  - repo: https://github.com/pre-commit-ci/pre-commit-ci-config
    rev: v1.6.1
    hooks:
      - id: check-pre-commit-ci-config

  - repo: https://github.com/billwallis/bills-hooks
    rev: v0.0.18
    hooks:
      - id: banned-python-code
      - id: check-github-codeowners
      - id: check-no-commit-comment
      - id: tidy-gitkeep

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-compose-spec

  - repo: local
    hooks:
      - id: check-pyproject
        name: Validate pyproject.toml schema
        entry: check-jsonschema
        args: ["--schemafile", "https://json.schemastore.org/pyproject.json"]
        files: pyproject.toml
        pass_filenames: true
        language: python
        additional_dependencies: ["check-jsonschema==0.39.0"]
        # This calls a remote URL, so run on pre-push to avoid slowing down commits
        stages: ["pre-push"]

  - repo: local
    hooks:
      - <<: &tests-config
          language: unsupported
          pass_filenames: false
          always_run: true
          stages: ["pre-push"]
        id: pytest
        name: Run unit tests
        entry: coverage run -m pytest --quiet
      - <<: *tests-config
        id: test-coverage
        name: Tests have 100% run coverage
        entry: coverage report --no-skip-covered --include 'tests/*' --fail-under 100
      - <<: *tests-config
        id: coverage-xml
        name: Write coverage XML report
        entry: coverage xml --include 'src/*' --quiet
      - <<: *tests-config
        id: coverage-badge
        name: Generate coverage badge
        entry: genbadge coverage --input-file 'coverage.xml' --output-file coverage.svg --silent
        # https://github.com/smarie/python-genbadge/releases
        additional_dependencies: ["genbadge[coverage]==1.1.3"]
        language: python
