# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-py-wrap"  # Not `dbt-py` to avoid confusion with the DbtPy package (PyPI requirement)
version = "0.1.1-rc.1"
description = "Python wrapper for dbt-core to extend dbt with custom Python."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/dbt-py"
urls.Repository = "https://github.com/billwallis/dbt-py"
urls.Issues = "https://github.com/billwallis/dbt-py/issues"
urls.Documentation = "https://github.com/billwallis/dbt-py/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dbt-core>=1.10.0,<2.0.0",
]
scripts.dbt-py = "dbt_py:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "dbt-duckdb>=1.10.0",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
markers = "integration"
testpaths = ["tests"]


[tool.coverage]
run.source = ["src", "tests"]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 100
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install --editable . --group dev --group test
    pre-commit install --install-hooks
"""
test.shell = """
    coverage erase
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'tests/*' --fail-under 100
    coverage report --no-skip-covered --include 'src/*'
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
