# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Tests
run-name: Tests 🧪

on:
  workflow_dispatch:
  pull_request:
  # Weekly smoke tests just to confirm nothing breaks in the dependencies,
  # as this isn't used often enough to rely on bug reports only.
  schedule:
    - cron: "0 6 * * 0"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
    steps:
      - name: 🛎️ Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
#          python-version: 3.13  # PyO3's maximum supported version is currently 3.13 (https://github.com/billwallis/dbt-py/actions/runs/20742618569/job/59552449428?pr=51)
          python-version-file: pyproject.toml
          cache: "pip"

      - name: 🔨 Install dependencies
        run: pip install --editable . --group test

      - name: ✅ Run unit tests
        run: pytest -vvv --color yes
        env:
          # TODO: This is configured in the tests, but not being picked up in CI
          DBT_PY_PACKAGE_ROOT: "tests.integration.jaffle-shop.dbt_py_test"
          DBT_PY_PACKAGE_NAME: "dbt_py_test"
